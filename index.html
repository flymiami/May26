<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>FLY MIAMI · EPIC · Ask Facundo</title>
<style>
  :root{
    --bg:#0a0a12; --panel:#14141f; --ink:#f4f4f8; --muted:#9aa0b5;
    --accent:#ff3da6; --accent2:#36c5ff; --gold:#ffcf4d;
    --usa:#3b5bdb; --pride:#ff5ca0; --fifa:#2bd47a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden}
  #app{display:flex;flex-direction:column;height:100vh}
  header{padding:22px 28px 14px;display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid #ffffff14}
  .brand{font-weight:800;letter-spacing:.5px;font-size:26px}
  .brand small{display:block;font-weight:500;color:var(--muted);font-size:13px;letter-spacing:2px;margin-top:2px}
  .live{font-size:12px;color:var(--muted)}
  main{flex:1;display:flex;min-height:0}
  /* gallery */
  #gallery{flex:1.4;overflow-y:auto;padding:20px;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;align-content:start}
  .card{background:var(--panel);border:1px solid #ffffff14;border-radius:18px;overflow:hidden;
    cursor:pointer;transition:transform .12s ease,border-color .12s ease;display:flex;flex-direction:column}
  .card:active{transform:scale(.97)}
  .card.sel{border-color:var(--accent)}
  .thumb{aspect-ratio:4/3;min-height:0;overflow:hidden;background:#1d1d2b;display:flex;align-items:center;justify-content:center;
    font-size:46px;position:relative}
  .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .tag{position:absolute;top:8px;left:8px;font-size:10px;font-weight:700;letter-spacing:1px;
    padding:4px 8px;border-radius:999px;background:#000a;text-transform:uppercase}
  .tag.USA{color:#fff;background:var(--usa)} .tag.PRIDE{color:#fff;background:var(--pride)}
  .tag.FIFA{color:#062;background:var(--fifa)} .tag.LOVE{color:#321;background:var(--gold)}
  .meta{padding:12px 14px}
  .meta h3{margin:0 0 4px;font-size:15px;line-height:1.2}
  .meta .sub{color:var(--muted);font-size:12px}
  .meta .price{margin-top:6px;font-weight:700;color:var(--gold);font-size:14px}
  /* guide */
  #guide{flex:1;min-width:340px;max-width:460px;border-left:1px solid #ffffff14;
    display:flex;flex-direction:column;background:#0d0d18}
  #chat{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
  .bubble{max-width:90%;padding:12px 15px;border-radius:16px;font-size:15px;line-height:1.4;animation:pop .18s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .me{align-self:flex-end;background:var(--accent2);color:#012;border-bottom-right-radius:4px}
  .fy{align-self:flex-start;background:#1c1c2b;border-bottom-left-radius:4px}
  .fy b{color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px;border-top:1px solid #ffffff14}
  .chip{background:#1c1c2b;border:1px solid #ffffff1a;color:var(--ink);font-size:13px;
    padding:8px 12px;border-radius:999px;cursor:pointer}
  .chip:active{background:var(--accent);color:#012}
  .inrow{display:flex;gap:8px;padding:12px 14px;border-top:1px solid #ffffff14}
  #q{flex:1;background:#1c1c2b;border:1px solid #ffffff1a;border-radius:14px;color:var(--ink);
    padding:12px 14px;font-size:15px;outline:none}
  .btn{background:var(--accent);color:#012;border:none;border-radius:14px;padding:0 16px;
    font-weight:700;font-size:15px;cursor:pointer}
  .btn.alt{background:#1c1c2b;color:var(--ink);border:1px solid #ffffff1a}
  .speakhint{font-size:11px;color:var(--muted);text-align:center;padding:4px 0 10px}
  @media(max-width:820px){
    main{flex-direction:column} #guide{max-width:none;border-left:none;border-top:1px solid #ffffff14}
    #gallery{flex:none;max-height:46vh}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">FLY MIAMI <small>FACUNDO YEBNE · KIMPTON EPIC · 2026</small></div>
    <div class="live">Tap an artwork &nbsp;·&nbsp; or ask me anything</div>
  </header>
  <main>
    <section id="gallery"></section>
    <aside id="guide">
      <div id="chat"></div>
      <div class="chips" id="chips"></div>
      <div class="inrow">
        <input id="q" placeholder="Ask about the show…" autocomplete="off" />
        <button class="btn" id="ask">Ask</button>
        <button class="btn alt" id="mic" title="Speak">🎤</button>
      </div>
      <div class="speakhint" id="ttsToggle">🔇 Voice OFF · tap to unmute</div>
    </aside>
  </main>
</div>
<script src="show.js?v=4"></script>
</body>
</html>
