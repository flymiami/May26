<div id="flykiosk"></div>
<style>
#flykiosk{position:fixed;inset:0;z-index:2147483647;background:#0a0a12;color:#f4f4f8;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;flex-direction:column;overflow:hidden}
#flykiosk *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
#flykiosk .fkhead{padding:18px 24px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff14}
#flykiosk .brand{font-weight:800;letter-spacing:.5px;font-size:24px;color:#fff}
#flykiosk .brand small{display:block;font-weight:500;color:#9aa0b5;font-size:12px;letter-spacing:2px;margin-top:2px}
#flykiosk .live{font-size:12px;color:#9aa0b5}
#flykiosk .fkabout{padding:13px 24px;border-bottom:1px solid #ffffff14;background:#0d0d18;max-height:24vh;overflow-y:auto}
#flykiosk .fkabout h2{margin:0 0 6px;font-size:15px;letter-spacing:.5px;color:#ff3da6}
#flykiosk .fkabout p{margin:0;font-size:13.5px;line-height:1.5;color:#d7d9e6;max-width:1100px}
#flykiosk .fkabout p b{color:#fff}
#flykiosk .atags{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
#flykiosk .atags span{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:4px 9px;border-radius:999px}
#flykiosk .atags .USA{color:#fff;background:#3b5bdb}
#flykiosk .atags .PRIDE{color:#fff;background:#ff5ca0}
#flykiosk .atags .FIFA{color:#062;background:#2bd47a}
#flykiosk .fkmain{flex:1;display:flex;min-height:0}
#flykiosk .fkgal{flex:1.4;overflow-y:auto;padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:15px;align-content:start}
#flykiosk .card{background:#14141f;border:1px solid #ffffff14;border-radius:18px;overflow:hidden;cursor:pointer;transition:transform .12s,border-color .12s;display:flex;flex-direction:column}
#flykiosk .card:active{transform:scale(.97)}
#flykiosk .card.sel{border-color:#ff3da6}
#flykiosk .thumb{aspect-ratio:4/3;min-height:0;overflow:hidden;background:#1d1d2b;display:flex;align-items:center;justify-content:center;font-size:46px;position:relative}
#flykiosk .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#flykiosk .tag{position:absolute;top:8px;left:8px;font-size:10px;font-weight:700;letter-spacing:1px;padding:4px 8px;border-radius:999px;background:#000a;text-transform:uppercase}
#flykiosk .tag.USA{color:#fff;background:#3b5bdb} #flykiosk .tag.PRIDE{color:#fff;background:#ff5ca0}
#flykiosk .tag.FIFA{color:#062;background:#2bd47a} #flykiosk .tag.LOVE{color:#321;background:#ffcf4d}
#flykiosk .meta{padding:11px 13px}
#flykiosk .meta h3{margin:0 0 4px;font-size:15px;line-height:1.2;color:#fff}
#flykiosk .meta .sub{color:#9aa0b5;font-size:12px}
#flykiosk .meta .price{margin-top:6px;font-weight:700;color:#ffcf4d;font-size:14px}
#flykiosk .fkguide{flex:1;min-width:320px;max-width:440px;border-left:1px solid #ffffff14;display:flex;flex-direction:column;background:#0d0d18}
#flykiosk .fkchat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:11px}
#flykiosk .bubble{max-width:90%;padding:11px 14px;border-radius:16px;font-size:15px;line-height:1.4}
#flykiosk .me{align-self:flex-end;background:#36c5ff;color:#012;border-bottom-right-radius:4px}
#flykiosk .fy{align-self:flex-start;background:#1c1c2b;border-bottom-left-radius:4px}
#flykiosk .fy b{color:#ff3da6}
#flykiosk .fkchips{display:flex;flex-wrap:wrap;gap:8px;padding:10px 13px;border-top:1px solid #ffffff14}
#flykiosk .chip{background:#1c1c2b;border:1px solid #ffffff1a;color:#f4f4f8;font-size:13px;padding:8px 12px;border-radius:999px;cursor:pointer}
#flykiosk .chip:active{background:#ff3da6;color:#012}
#flykiosk .inrow{display:flex;gap:8px;padding:12px 13px;border-top:1px solid #ffffff14}
#flykiosk .inrow input{flex:1;background:#1c1c2b;border:1px solid #ffffff1a;border-radius:14px;color:#f4f4f8;padding:12px 14px;font-size:15px;outline:none}
#flykiosk .btn{background:#ff3da6;color:#012;border:none;border-radius:14px;padding:0 16px;font-weight:700;font-size:15px;cursor:pointer}
#flykiosk .btn.alt{background:#1c1c2b;color:#f4f4f8;border:1px solid #ffffff1a}
#flykiosk .speakhint{font-size:11px;color:#9aa0b5;text-align:center;padding:4px 0 10px;cursor:pointer}
@media(max-width:820px){#flykiosk .fkmain{flex-direction:column} #flykiosk .fkguide{max-width:none;border-left:none;border-top:1px solid #ffffff14} #flykiosk .fkgal{flex:none;max-height:44vh}}
</style>
<script>
(function(){
var ARTIST={name:"Facundo Yebne",handle:"@flymiami.art",show:"Kimpton EPIC Hotel, Downtown Miami",when:"Summer 2026 (June to July)",themes:"USA 250 · Miami Pride · FIFA World Cup 2026",about:"I'm Facundo Yebne, FLY. I build sculptures and wall works out of thousands of rubber and resin ducks. One material, one message: peace, love, and joy. This EPIC residency lands right as the world arrives in Miami for the World Cup, Pride, and the USA 250th, so the whole floor is built around unity."};
var TH={USA:"🦅",PRIDE:"🌈",FIFA:"⚽",LOVE:"💗",MIAMI:"🦩"};
var C="https://cdn.shopify.com/s/files/1/0997/7974/0016/files/";
var ART=[
{n:1,slug:"united-kuakies",title:"United Kuakies of America",theme:"USA",img:C+"kiosk-united-kuakies.jpg?v=1780520926",medium:"Tiny resin ducks (solid)",size:"12 × 18 in",price:2000,loc:"16th Floor",desc:"An iconic flag reimagined, every red, white and blue stripe hand-built from solid resin ducks in perfect formation. Patriotism through playful precision."},
{n:2,slug:"dont-kuack-liberty",title:"Don't Kuack With Liberty",theme:"USA",img:C+"kiosk-dont-kuack-liberty.jpg?v=1780520926",medium:"Tiny resin ducks (solid)",size:"18 × 24 in",price:2600,loc:"16th Floor",desc:"Lady Liberty rebuilt from hundreds of tiny resin ducks, a symbol of freedom run through repetition, humor and material transformation into my pop vocabulary."},
{n:3,slug:"peace-pride",title:"Peace, We All Need Some, Pride",theme:"PRIDE",img:"",medium:"Mini rubber ducks",size:"36 × 36 in",price:3000,loc:"16th Floor · Pride wall",desc:"The universal peace symbol reimagined across the Pride spectrum. Color and repetition become a call for shared humanity and visibility."},
{n:4,slug:"love-for-argentina",title:"Love For Argentina",theme:"FIFA",img:C+"kiosk-love-for-argentina.jpg?v=1780520926",medium:"Mini rubber ducks + glow resin",size:"18 × 24 in",price:2000,loc:"16th Floor",desc:"A love letter to my homeland in sky-blue and white, mini rubber ducks layered with glowing resin that comes alive after dark."},
{n:5,slug:"corazon-argentina",title:"Corazón de Argentina",theme:"FIFA",img:C+"kiosk-corazon-argentina.jpg?v=1780520927",medium:"Resin ducks (solid + neon)",size:"16 × 16 in",price:1000,loc:"16th Floor",desc:"A heart for the homeland, intimate in scale, vivid in feeling. Solid and neon resin ducks build a glowing core in Argentina's colors."},
{n:6,slug:"america-peace",title:"America Peace",theme:"USA",img:C+"kiosk-america-peace.jpg?v=1780520926",medium:"Mini rubber ducks",size:"20 × 20 in",price:1000,loc:"16th Floor",desc:"A meditation on the American dream through a peace symbol. A quiet manifesto bridging the show's USA and Peace threads."},
{n:7,slug:"polaroid",title:"Polaroid",theme:"USA",img:"",medium:"Rubber ducks, several sizes",size:"50 × 70 in",price:3000,loc:"16th Floor",desc:"A monumental snapshot built from rubber ducks at multiple scales, the most nostalgic of frames stretched into a billboard for memory and material."},
{n:8,slug:"messi-argentina",title:"Messi Argentina",theme:"FIFA",img:C+"kiosk-messi-argentina-sm.jpg?v=1780521057",medium:"Resin ducks (solid + glow)",size:"18 × 24 in",price:1600,loc:"16th Floor · near terrace",desc:"A tribute to Lionel Messi, sport, art and innovation in sky-blue and white. Glow-in-the-dark resin anchors the FIFA wall."},
{n:9,slug:"pulisic-usa",title:"Pulisic for USA",theme:"FIFA",img:C+"kiosk-pulisic-usa.jpg?v=1780520926",medium:"Resin ducks (solid + glow)",size:"18 × 24 in",price:1600,loc:"16th Floor · near elevator",desc:"Christian Pulisic for Team USA, the man carrying American football into the 2026 World Cup, in resin ducks that glow when the lights drop."},
{n:10,slug:"its-so-miami",title:"It's so Miami",theme:"PRIDE",img:C+"its-so-miami.jpg?v=1780513463",medium:"Tiny resin flamingos",size:"30 × 30 in",price:5000,loc:"16th Floor · Pride side",desc:"Miami in one image, built from resin flamingos, not ducks. The city's queer-coded flamingo meets a sunset reimagined in Pride color."},
{n:11,slug:"unitybeak-love",title:"UnityBeak Trilogy: Love",theme:"LOVE",img:"",medium:"Mini rubber ducks (sculpture)",size:"4' × 3.5' × 4.2'",price:10000,loc:"Lobby · left of entrance",desc:"Love as a unifying force connecting individuality into a shared whole, thousands of mini rubber ducks in three dimensions, the first thing that welcomes you."},
{n:12,slug:"proud-love-pink",title:"Proud Love Pink",theme:"PRIDE",img:C+"kiosk-proud-love-pink.jpg?v=1780520926",medium:"Medium rubber ducks over fiberglass",size:"~7.5' tall on cherub base",price:10000,loc:"16th Floor · center",desc:"A pink heart rising from a classical cherub base, medium rubber ducks in layers of pink and red. Love monumentalized, a statement on pride, visibility and devotion."},
{n:13,slug:"world-cup-duck",title:"World Cup Duck",theme:"FIFA",img:C+"kiosk-world-cup-duck.jpg?v=1780520926",medium:"Mini rubber ducks (sculpture)",size:"4' × 3.5' × 4.2'",price:10000,loc:"Lobby / 16th Floor",desc:"A message of unity in the mixed flags of the favorite nations of FIFA World Cup 2026, thousands of mini rubber ducks assembled in three dimensions."}
];
var root=document.getElementById("flykiosk");
root.innerHTML='<div class="fkhead"><div class="brand">FLY MIAMI <small>FACUNDO YEBNE · KIMPTON EPIC · 2026</small></div><div class="live">Tap an artwork &nbsp;·&nbsp; or ask me anything</div></div>'+
'<div class="fkabout"><h2>About the show &amp; the artist</h2><p id="fkAbout"></p><div class="atags"><span class="USA">USA 250</span><span class="PRIDE">Miami Pride</span><span class="FIFA">FIFA World Cup 2026</span></div></div>'+
'<div class="fkmain"><section class="fkgal" id="fkGal"></section><aside class="fkguide"><div class="fkchat" id="fkChat"></div><div class="fkchips" id="fkChips"></div><div class="inrow"><input id="fkQ" placeholder="Ask about the show…" autocomplete="off"/><button class="btn" id="fkAsk">Ask</button><button class="btn alt" id="fkMic" title="Speak">🎤</button></div><div class="speakhint" id="fkTts">🔇 Voice OFF · tap to unmute</div></aside></div>';
var ttsOn = false,selected=null;
document.getElementById("fkAbout").innerHTML="<b>"+ARTIST.name+" (FLY) at the "+ARTIST.show+", "+ARTIST.when+".</b> "+ARTIST.about+" <b>13 works</b> across three threads — patriotism, Pride and the World Cup — priced $1,000–$10,000. Tap any piece to hear its story, or ask me anything. Find me at <b>"+ARTIST.handle+"</b>.";
var gal=document.getElementById("fkGal");
ART.forEach(function(a){var c=document.createElement("div");c.className="card";c.dataset.slug=a.slug;var em=TH[a.theme]||"🦆";var vis=a.img?'<img src="'+a.img+'" alt="'+a.title+'" onerror="this.style.display=\'none\';this.parentNode.insertAdjacentText(\'beforeend\',\''+em+'\')">':em;c.innerHTML='<div class="thumb"><span class="tag '+a.theme+'">'+a.theme+'</span>'+vis+'</div><div class="meta"><h3>'+a.n+'. '+a.title+'</h3><div class="sub">'+a.medium+' · '+a.size+'</div><div class="price">$'+a.price.toLocaleString()+'</div></div>';c.onclick=function(){selectArt(a.slug);};gal.appendChild(c);});
var chat=document.getElementById("fkChat");
function say(t,who){who=who||"fy";var b=document.createElement("div");b.className="bubble "+who;b.innerHTML=t;chat.appendChild(b);chat.scrollTop=chat.scrollHeight;if(who==="fy"&&ttsOn)speak(t.replace(/<[^>]+>/g," "));}
function selectArt(slug){selected=ART.filter(function(a){return a.slug===slug;})[0];var cs=root.querySelectorAll(".card");for(var i=0;i<cs.length;i++)cs[i].classList.toggle("sel",cs[i].dataset.slug===slug);say("<b>"+selected.title+"</b>, "+selected.desc+"<br><br><i>"+selected.medium+" · "+selected.size+" · "+selected.loc+" · $"+selected.price.toLocaleString()+"</i>");}
function answer(qRaw){var q=qRaw.toLowerCase();var hit=ART.filter(function(a){return q.indexOf(a.title.toLowerCase().split(" ")[0])>=0||a.title.toLowerCase().split(" ").some(function(w){return w.length>3&&q.indexOf(w)>=0;});})[0];
if(/who are you|your name|about you|who is|artist|facundo|\bfly\b/.test(q))return "<b>"+ARTIST.about+"</b>";
if(/where|when|show|exhibit|epic|hotel|address/.test(q))return "This is <b>"+ARTIST.show+"</b>, "+ARTIST.when+". Themes: "+ARTIST.themes+". Find me at "+ARTIST.handle+".";
if(/how many|number of|total/.test(q))return "There are <b>"+ART.length+" works</b> in the show, wall pieces and three large sculptures.";
if(/price|cost|buy|sale|how much|purchase/.test(q)){if(hit)return "<b>"+hit.title+"</b> is <b>$"+hit.price.toLocaleString()+"</b>. Tap the card for full details.";return "Prices run <b>$1,000 to $10,000</b>. Tap any artwork for its price, or ask \"how much is Messi?\"";}
if(/duck|material|made of|how.*made|resin|rubber/.test(q))return "Everything is built from <b>rubber and resin ducks</b>, solid, mini, glow and neon, placed by hand. One mass-produced object, turned into peace, love and joy.";
if(/glow|dark|night|neon/.test(q))return "Several pieces, Messi, Pulisic, Love For Argentina, Corazón, use <b>glow and neon resin</b> that comes alive when the lights drop. Come back after dark.";
if(/pride|lgbt|queer/.test(q))return "The Pride wall: <b>Peace We All Need Some</b>, <b>It's so Miami</b> and <b>Proud Love Pink</b>, color, flamingos and a 7.5' heart.";
if(/fifa|soccer|football|world cup|messi|argentina/.test(q))return "The FIFA wall: <b>Messi Argentina</b>, <b>Pulisic for USA</b>, <b>World Cup Duck</b>, plus my Argentine love letters. Built for World Cup 2026.";
if(hit)return "<b>"+hit.title+"</b>, "+hit.desc;
return "Good question. Tap any artwork to hear its story, or ask me about the ducks, the themes, prices, or where to find me ("+ARTIST.handle+").";}
function handleAsk(t){if(!t.trim())return;say(t,"me");setTimeout(function(){say(answer(t));},250);}
var q=document.getElementById("fkQ");
document.getElementById("fkAsk").onclick=function(){handleAsk(q.value);q.value="";};
q.addEventListener("keydown",function(e){if(e.key==="Enter"){handleAsk(q.value);q.value="";}});
var chips=["Who are you?","Tell me about the ducks","Show me the FIFA wall","What's on the Pride wall?","How much is Proud Love Pink?","When & where is the show?"];
var cb=document.getElementById("fkChips");
chips.forEach(function(t){var el=document.createElement("div");el.className="chip";el.textContent=t;el.onclick=function(){handleAsk(t);};cb.appendChild(el);});
var voice=null;
function pickVoice(){var vs=speechSynthesis.getVoices();voice=vs.filter(function(v){return /en-US/i.test(v.lang)&&/male|Daniel|Alex|Google US/i.test(v.name);})[0]||vs.filter(function(v){return /en/i.test(v.lang);})[0]||vs[0];}
if("speechSynthesis" in window){speechSynthesis.onvoiceschanged=pickVoice;pickVoice();}
function speak(t){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.voice=voice;u.rate=1;u.pitch=1;speechSynthesis.speak(u);}
document.getElementById("fkTts").onclick=function(){ttsOn=!ttsOn;this.textContent=ttsOn?"🔊 Voice ON · tap to mute":"🔇 Voice OFF · tap to unmute";if(!ttsOn)speechSynthesis.cancel();};
var mic=document.getElementById("fkMic");
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){var rec=new SR();rec.lang="en-US";rec.interimResults=false;mic.onclick=function(){try{rec.start();mic.textContent="…";}catch(e){}};rec.onresult=function(e){mic.textContent="🎤";handleAsk(e.results[0][0].transcript);};rec.onerror=function(){mic.textContent="🎤";};rec.onend=function(){mic.textContent="🎤";};}else{mic.style.display="none";}
say("👋 Hi, I'm <b>Facundo</b>. Welcome to my EPIC show, thousands of rubber ducks for peace, love and joy. Tap any piece to hear its story, or just ask me anything.");
})();
</script>
